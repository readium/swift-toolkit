# Playground project with Readium LCP, generated by `make playground lcp=<url>`.
include:
  # `relativePaths: false` keeps the included paths relative to the project
  # root rather than to the Support folder.
  - path: Support/project.yml
    relativePaths: false

packages:
  R2LCPClient:
    # The repository's Support folder, shared with the TestApp project. See the
    # root Makefile.
    path: ../Support/R2LCPClient

settings:
  OTHER_SWIFT_FLAGS: -DLCP

targets:
  Playground:
    dependencies:
      - package: R2LCPClient
        product: R2LCPClient
      - package: Readium
        product: ReadiumLCP

  ReadiumLCPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Tests/LCPTests
        group: ReadiumLCPTests
      - path: ../Tests/Publications/TestPublications.swift
        group: ReadiumLCPTests
      - path: ../Tests/Publications/Publications
        type: folder
        group: ReadiumLCPTests
    dependencies:
      - target: Playground
    settings:
      GENERATE_INFOPLIST_FILE: YES
