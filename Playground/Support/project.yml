# Playground project without Readium LCP, generated by `make playground`.
name: Playground
options:
  bundleIdPrefix: org.readium
settings:
  SWIFT_VERSION: 6.0
  SWIFT_APPROACHABLE_CONCURRENCY: Yes
  SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  Readium:
    path: ..
schemes:
  Playground:
    build:
      targets:
        Playground:
    test:
      testPlans:
        # Generated by `make playground` from Support/Playground.xctestplan,
        # with the LCP tests when `lcp=<url>` is provided.
        - path: Playground.xctestplan
          defaultPlan: true
targets:
  Playground:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: 
      - path: Sources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumOPDS
