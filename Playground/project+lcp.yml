include:
  - project-base.yml

packages:
  R2LCPClient:
    path: R2LCPClient

schemes:
  Playground:
    test:
      testPlans:
        - path: Playground+lcp.xctestplan
          defaultPlan: true

targets:
  Playground:
    dependencies:
      - package: R2LCPClient
        product: R2LCPClient
      - package: Readium
        product: ReadiumLCP
    settings:
      OTHER_SWIFT_FLAGS: -DLCP

  ReadiumLCPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Tests/LCPTests
        group: ReadiumLCPTests
      - path: ../Tests/Publications/TestPublications.swift
        group: ReadiumLCPTests
      - path: ../Tests/Publications/Publications
        type: folder
        group: ReadiumLCPTests
    dependencies:
      - target: Playground
    settings:
      GENERATE_INFOPLIST_FILE: YES
      OTHER_SWIFT_FLAGS: -DLCP
