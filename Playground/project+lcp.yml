name: Playground
options:
  bundleIdPrefix: org.readium
packages:
  Readium:
    path: ..
  R2LCPClient:
    path: R2LCPClient
schemes:
  Playground:
    build:
      targets:
        Playground:
    test:
      testPlans:
        - path: Playground+lcp.xctestplan
          defaultPlan: true
targets:
  Playground:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: 
      - path: Sources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumOPDS
      - package: R2LCPClient
        product: R2LCPClient
      - package: Readium
        product: ReadiumLCP
    settings:
      SWIFT_APPROACHABLE_CONCURRENCY: Yes
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      OTHER_SWIFT_FLAGS: -DLCP

  ReadiumLCPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ../Tests/LCPTests
        group: ReadiumLCPTests
      - path: ../Tests/Publications/TestPublications.swift
        group: ReadiumLCPTests
      - path: ../Tests/Publications/Publications
        type: folder
        group: ReadiumLCPTests
    dependencies:
      - target: Playground
    settings:
      GENERATE_INFOPLIST_FILE: YES
      OTHER_SWIFT_FLAGS: -DLCP

