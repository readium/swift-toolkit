name: Playground
options:
  bundleIdPrefix: org.readium
settings:
  SWIFT_VERSION: 6.0
  SWIFT_APPROACHABLE_CONCURRENCY: Yes
  SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
packages:
  Readium:
    path: ..
schemes:
  Playground:
    build:
      targets:
        Playground:
targets:
  Playground:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: 
      - path: Sources
    dependencies:
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - package: Readium
        product: ReadiumOPDS
